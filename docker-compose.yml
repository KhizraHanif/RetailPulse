services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: retailpulse-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: retailpulse-redis

    command: redis-server --save 60 1 --loglevel warning

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  celery_worker:
    build:
      context: ./backend

    container_name: retailpulse-celery-worker

    command: >
      celery -A app.core.celery_app.celery_app worker
      --loglevel=info

    env_file:
      - ./backend/.env

    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  rabbitmq_data:
  redis_data: